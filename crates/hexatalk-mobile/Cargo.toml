# Standalone workspace so `cargo apk` works (parent HexaTalk workspace is ignored).
[workspace]

[package]
name = "hexatalk-mobile"
version = "0.3.0"
edition = "2021"
description = "HexaTalk mobile — Rust + Slint (native IME / long-press paste), same Convex backend"
publish = false

[lib]
name = "hexatalk_mobile"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
slint-build = "1.17.1"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
dirs = "5"
log = "0.4"

# Desktop preview (Windows / Linux / macOS)
[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"
slint = { version = "1.17.1", default-features = false, features = [
    "compat-1-2",
    "std",
    "backend-winit",
    "renderer-femtovg",
    "accessibility",
] }

# Android APK — official Slint android-activity backend (platform IME / paste)
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
slint = { version = "1.17.1", default-features = false, features = [
    "compat-1-2",
    "std",
    "backend-android-activity-06",
    "renderer-skia",
] }

[package.metadata.android]
package = "com.hexatalk.mobile"
apk_name = "HexaTalk"
build_targets = ["aarch64-linux-android"]
# Android resources (launcher icon mipmaps + adaptive icon).
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[package.metadata.android.application]
label = "HexaTalk"
icon = "@mipmap/ic_launcher"

# Release signing: intentionally NOT configured here. Signing a release APK
# previously reused the public debug keystore (`.android-debug.keystore`,
# password "android"), which means anyone could ship an update with our
# signature. Instead, `cargo apk build --release` reads the keystore from
# environment variables:
#   CARGO_APK_RELEASE_KEYSTORE          — path to the release .keystore
#   CARGO_APK_RELEASE_KEYSTORE_PASSWORD — its password
# (cargo-apk 0.10 signs with the keystore's key directly; there is no
# key_alias/key_password override, so generate the keystore with a single
# key and one password). Generate one via `scripts/gen_release_keystore.ps1`.
# Debug builds keep using the standard auto-generated debug keystore.

[[example]]
name = "desktop"
path = "examples/desktop.rs"
