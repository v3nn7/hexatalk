[workspace]
members = [".", "crates/reprotocol", "crates/hexatalk-bot"]
# hexatalk-mobile is a standalone crate (own [workspace]) so cargo-apk can build APKs.
resolver = "2"

[package]
name = "HexaTalk"
version = "0.1.2"
edition = "2024"

[dependencies]
# GUI toolkit: Slint (see ui/*.slint + src/rt.rs). The old iced frontend
# (src/view/*.rs) has been fully ported and removed.
slint = { version = "1.17.1", features = ["unstable-winit-030"] }
copypasta = "0.10"
convex = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
futures = "0.3"
dotenvy = "0.15"
maplit = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
webrtc = "0.17.1"
# RTP packet building for the ADPCM wire codec (TrackLocalStaticRTP) — same
# version webrtc 0.17.1 itself depends on.
rtp = "0.17.1"
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
bytes = "1.12.1"
rfd = "0.17.2"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
xcap = "0.9.6"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
# Release-signature verification for the auto-updater (src/update_check.rs).
# 2.x matches the rand_core 0.6 already in the tree; only signature
# verification is needed here, so keygen/pkcs8 features stay off.
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
# bsdiff-compatible binary delta patcher for incremental updates
# (src/update_check.rs) — only the patch side (`Bspatch`) runs in the app;
# `Bsdiff` is used offline at release time to produce the delta files.
qbsdiff = "1.4"
aes-gcm = "0.10"
hkdf = "0.13.0"
sha2 = "0.11.0"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22.1"
notify-rust = "4.18.0"
# Local protocol crate (folder name `reprotocol`, package name `peerseal`).
# Do not modify crates/reprotocol — integrate only.
peerseal = { path = "crates/reprotocol" }
rustls = { version = "0.23.42", default-features = false, features = ["std", "tls12", "ring"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Media_Multimedia", "Win32_Security_Cryptography"] }

# The tray icon needs a live event loop on whatever thread owns it: a Win32
# message loop on Windows, a GTK/glib main loop on Linux (see src/tray.rs).
# gtk/glib are only needed to drive that loop ourselves on Linux -- tray-icon
# doesn't start one for you.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tray-icon = "0.24"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
glib = "0.18"

# Bakes the app icon into the .exe's own PE resources (Explorer/taskbar
# shortcut icon before the app is even launched) — separate from the
# runtime window icon set in main.rs, which only affects the icon while
# the app is actually running.
[build-dependencies]
slint-build = "1.17.1"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "2"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
